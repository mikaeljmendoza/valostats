<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValStats</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="inner-navbar">
        <div class="logo">
            <a href="index.html"> 
                <img src="images/valstats.png" alt="ValStats Logo">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="stats.html">Stats</a></li>
            <li><a href="agents.html">Agents</a></li>
            <li><a href="news.html">News</a></li>
        </ul>
    </div>
</div>


<main class="page-content">
    <!-- HERO BACKGROUND SECTION -->
    <div class="hero">

        <video autoplay muted loop playsinline class="hero-video">
            <source src="files/website_bg_vid.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

        <!-- HERO CONTENT (NEWS ONLY INSIDE HERO) -->
        <div class="container">
            <h2>Latest News</h2>
            <div class="news">

                <a class="news-card" href="https://playvalorant.com/en-us/news/game-updates/valorant-patch-notes-12-07/" target="_blank">
                    <img src="images/patch1207.png" alt="VALORANT Patch Notes 12.07">
                    <p>VALORANT Patch Notes 12.07</p>
                </a>


                <a class="news-card" href="https://playvalorant.com/en-us/news/game-updates/valorant-patch-notes-12-06/" target="_blank">
                    <img src="images/patch1206.png" alt="VALORANT Patch Notes 12.06">
                    <p>VALORANT Patch Notes 12.06</p>
                </a>

                <a class="news-card" href="https://playvalorant.com/en-us/news/game-updates/valorant-patch-notes-12-05/" target="_blank">
                    <img src="images/patch1205.png" alt="VALORANT Patch Notes 12.05">
                    <p>VALORANT Patch Notes 12.05</p>
                </a>

            </div>
        </div>
    </div>

    <!-- PANELS (NOW OUTSIDE HERO) -->
    <div class="container">
        <div class="panels">
            <!-- AGENT STATS -->
            <div class="panel">
                <h3>Valorant Agent Stats</h3>
                <div class="content">

                    <div class="table-header">
                        <span>Agent</span>
                        <span>Win Rate</span>
                        <span>K/D</span>
                        <span>ACS</span>
                    </div>

                    <div class="agent-list" id="homeAgentList"></div>
                </div>

                <a href="stats.html">
                    <button class="btn">View All Agent Stats</button>
                </a>      
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-content">
        <img
            src="images/valstats.png"
            alt="ValStats Logo"
            class="footer-logo"
        >
        <p>Website created for DECO1400 by Michael Mendoza</p>
        <p>© 2026 ValStats. All rights reserved.</p>
    </div>
</footer>

<script src="js/data.js"></script>
<script src="js/home.js"></script>

</body>
</html>
